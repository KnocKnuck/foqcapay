version: '3.8'

services:
  # Redis for event bus
  redis:
    image: redis:7-alpine
    container_name: foqcapay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - foqcapay-network

  # FOQCAPAY Trading Bot (Backend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foqcapay-backend
    ports:
      - "8000:8000"
    environment:
      # Trading Configuration
      - TRADING_MODE=demo
      - TRADING_PAIRS=BTC/USDC,ETH/USDC,LINK/USDC

      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # Security (set these in .env file)
      - COINEX_API_KEY=${COINEX_API_KEY:-}
      - COINEX_API_SECRET=${COINEX_API_SECRET:-}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD:-foqcapay_default_password}

      # Risk Management
      - MAX_POSITION_SIZE=5000
      - MAX_DAILY_VOLUME=20000
      - MAX_DRAWDOWN_PCT=10
      - DAILY_LOSS_LIMIT_PCT=5

      # Logging
      - LOG_LEVEL=INFO
      - DEBUG=false

    volumes:
      # Persist database
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
      # Mount .env for secrets (optional)
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - foqcapay-network
    restart: unless-stopped

  # Frontend (Next.js) - Optional
  # Uncomment when frontend is ready
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: foqcapay-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000
  #   depends_on:
  #     - backend
  #   networks:
  #     - foqcapay-network
  #   restart: unless-stopped

networks:
  foqcapay-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
